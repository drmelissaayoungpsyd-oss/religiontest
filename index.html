<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Religion Blitz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one centered 640px column of hard-edged arcade blocks, each with a flat offset shadow. One boss sprite per round is the only character. */
:root{
  --ink:#120d33; --ink2:#1d1655; --line:#4a3ec2; --text:#f6f3ff; --mute:#b4abe8;
  --pink:#ff3d9a; --cyan:#27d3ff; --yellow:#ffd23f; --green:#34e0a1; --orange:#ff7a3d; --violet:#b57bff; --red:#ff5468;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Lexend','Trebuchet MS',Verdana,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;border-radius:0}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:500 17px/1.4 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   linear-gradient(rgba(74,62,194,.26) 1px,transparent 1px) 0 0/44px 44px,
   linear-gradient(90deg,rgba(74,62,194,.26) 1px,transparent 1px) 0 0/44px 44px;
  animation:grid 14s linear infinite}
@keyframes grid{to{background-position:0 44px,44px 0}}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:12px 16px 48px;min-height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#toasts{position:fixed;bottom:14px;left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:var(--yellow);color:#150f3a;padding:10px 16px;box-shadow:5px 5px 0 rgba(0,0,0,.6);animation:toast 2.6s ease forwards;max-width:420px;width:100%}
.toast b{display:block;font:400 17px/1.1 var(--display)}
.toast span{font-size:14px}
@keyframes toast{0%{transform:translateY(30px);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
h1,h2,h3{margin:0;font-weight:400}
button{font-family:inherit}
:focus-visible{outline:4px solid #fff;outline-offset:3px}

/* buttons */
.btn{font:400 18px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;background:var(--c,var(--yellow));color:#150f3a;border:0;padding:16px 18px;min-height:56px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.6);transition:transform .06s,box-shadow .06s;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.6)}
.btn.sm{font-size:13px;padding:10px 12px;min-height:42px;box-shadow:0 4px 0 rgba(0,0,0,.6)}
.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.6)}
.btn.ghost{background:var(--ink2);color:var(--text);box-shadow:inset 0 0 0 3px var(--line),0 5px 0 rgba(0,0,0,.6)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.block{width:100%}
.panel{background:var(--ink2);box-shadow:inset 0 0 0 3px var(--line),6px 6px 0 rgba(0,0,0,.6);padding:16px}

/* top bar */
.top{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.lvl{flex:1;min-width:0}
.lvlt{font:400 13px/1.1 var(--display);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvlt span{color:var(--yellow);margin-right:6px}
.bar{height:12px;background:#0a0724;box-shadow:inset 0 0 0 2px var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--yellow);transition:width .5s}
.bar.thin{height:8px}

/* home */
.title{font:400 clamp(40px,11vw,64px)/.92 var(--display);text-transform:uppercase;margin:6px 0 4px;color:#fff;text-shadow:4px 4px 0 var(--pink),8px 8px 0 var(--violet)}
.sub{color:var(--mute);margin:14px 0 20px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zone{display:block;width:100%;text-align:left;background:var(--ink2);color:var(--text);border:0;border-left:10px solid var(--zc);padding:14px 14px 12px;box-shadow:5px 5px 0 rgba(0,0,0,.65);cursor:pointer;font:inherit;transition:transform .08s}
.zone:active{transform:translate(3px,3px);box-shadow:2px 2px 0 rgba(0,0,0,.65)}
.zone h3{font:400 clamp(16px,4.4vw,21px)/1.1 var(--display);color:var(--zc);text-transform:uppercase}
.zone.wide{grid-column:1/-1}
.zmeta{display:flex;justify-content:space-between;align-items:center;margin:8px 0 2px;font-size:13px;color:var(--mute)}
.zsub{font-size:12px;color:var(--mute);margin-top:6px}
.stars{letter-spacing:2px;color:#4a3ec2;font-size:20px}
.stars b{color:var(--yellow);font-weight:400}
.bar.z i{background:var(--zc)}
.sect{font:400 14px/1 var(--display);color:var(--mute);text-transform:uppercase;margin:28px 0 12px;letter-spacing:.06em}
.setrow{display:flex;gap:10px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{background:var(--ink2);padding:10px;box-shadow:inset 0 0 0 2px var(--line);opacity:.5}
.badge.on{opacity:1;box-shadow:inset 0 0 0 3px var(--yellow)}
.badge b{display:block;font:400 13px/1.1 var(--display);text-transform:uppercase;color:var(--yellow)}
.badge span{font-size:12px;color:var(--mute)}
.foot{margin-top:26px;font-size:13px;color:var(--mute)}
.linkbtn{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px;padding:8px 0}

/* mode picker */
.zhead{font:400 clamp(30px,9vw,46px)/1 var(--display);text-transform:uppercase;margin:4px 0 6px}
.modes{display:grid;gap:18px;margin-top:20px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;width:100%;--c:var(--cyan)}
.mode .t{font:400 22px/1 var(--display)}
.mode .d{font:500 15px/1.3 var(--body);text-transform:none;letter-spacing:0}
.mode .best{font:500 13px var(--body);text-transform:none}

/* battle */
.hud{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.segs{display:flex;gap:4px;flex:1}
.segs i{flex:1;height:12px;background:#0a0724;box-shadow:inset 0 0 0 2px var(--line)}
.segs i.d{background:var(--zc);box-shadow:none}
.segs i.c{background:#fff;box-shadow:none;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.score{font:400 18px var(--display);color:var(--yellow);white-space:nowrap}
.stage{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.boss{flex:0 0 auto;width:112px;animation:bob 1.8s ease-in-out infinite}
.boss svg{display:block;width:100%;height:auto}
@keyframes bob{50%{transform:translateY(-6px)}}
.boss.hit{animation:hit .4s linear}
@keyframes hit{0%{transform:translateX(0);filter:brightness(3)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}100%{transform:none;filter:none}}
.boss.dead{animation:dead 1.1s ease-in forwards}
@keyframes dead{0%{filter:brightness(3)}60%{transform:rotate(180deg) scale(.6);opacity:1}100%{transform:rotate(360deg) scale(0);opacity:0}}
.bossinfo{flex:1;min-width:0}
.bname{font:400 12px var(--display);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.hp{height:20px;background:#0a0724;box-shadow:inset 0 0 0 3px var(--line);margin-top:6px}
.hp i{display:block;height:100%;background:var(--zc);transition:width .5s}
.combo{font:400 20px/1 var(--display);margin-top:8px;color:var(--mute);min-height:22px;transform-origin:left center}
.combo.pop{animation:cpop .35s}
@keyframes cpop{40%{transform:scale(1.35)}}
.combo.c3{color:var(--yellow)}.combo.c5{color:var(--orange)}.combo.c8{color:var(--pink);text-shadow:0 0 14px var(--pink)}
.qcard{margin-bottom:14px;position:relative;--zc:var(--cyan);border-top:8px solid var(--zc)}
.qe{font-size:44px;line-height:1;margin-bottom:8px}
.qt{font:600 clamp(19px,5vw,24px)/1.25 var(--body)}
.hint{display:inline-block;margin-top:8px;font-size:13px;color:var(--mute)}
.timer{height:8px;background:#0a0724;margin-top:14px;box-shadow:inset 0 0 0 2px var(--line)}
.timer i{display:block;height:100%;background:var(--green);width:100%}
.timer.frozen i{background:var(--cyan)}
.answers{display:grid;gap:14px}
.ans{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:600 18px/1.25 var(--body);color:var(--text);background:var(--ink2);border:0;box-shadow:inset 0 0 0 3px var(--line),0 5px 0 rgba(0,0,0,.6);padding:14px;min-height:62px;cursor:pointer;transition:transform .06s}
.ans:active{transform:translateY(4px)}
.ans kbd{font:400 14px var(--display);background:var(--line);color:#fff;padding:6px 9px;flex:0 0 auto}
@media (hover:hover){.ans:hover{box-shadow:inset 0 0 0 3px var(--cyan),0 5px 0 rgba(0,0,0,.6)}}
.ans.ok{background:var(--green);color:#06281c;box-shadow:0 5px 0 rgba(0,0,0,.6);animation:okpop .3s}
.ans.ok kbd{background:#06281c}
.ans.bad{background:var(--red);color:#2e0710;box-shadow:0 5px 0 rgba(0,0,0,.6);animation:shk .35s}
.ans.bad kbd{background:#2e0710}
.ans.gone{opacity:.12;pointer-events:none}
.ans.lock{pointer-events:none}
@keyframes okpop{50%{transform:scale(1.04)}}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pws{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.pw b{font-weight:400;color:var(--pink)}
.fb{margin-top:16px;padding:14px;animation:fbin .2s}
@keyframes fbin{from{transform:translateY(8px);opacity:0}}
.fb.bad{background:#2a1040;box-shadow:inset 0 0 0 3px var(--red)}
.fb.ok{background:#0c2b2a;box-shadow:inset 0 0 0 3px var(--green)}
.fbh{font:400 15px var(--display);text-transform:uppercase;margin-bottom:6px}
.fb.bad .fbh{color:var(--red)}.fb.ok .fbh{color:var(--green)}
.fba{font-weight:600;font-size:18px;margin-bottom:8px}
.fbt{font-size:15px;color:var(--mute);margin-bottom:12px}
.fb .btn{width:100%}
.pop{position:fixed;z-index:55;font:400 24px var(--display);pointer-events:none;text-shadow:3px 3px 0 rgba(0,0,0,.7);animation:floatup .95s ease-out forwards;transform:translateX(-50%)}
@keyframes floatup{to{transform:translate(-50%,-70px);opacity:0}}
body.shake #app{animation:shk .35s}

/* learn */
.lhud{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.left{font:400 14px var(--display);color:var(--mute);white-space:nowrap}
.flipwrap{perspective:1200px;margin-bottom:20px}
.flip{position:relative;height:370px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer;outline-offset:6px}
.flip.on{transform:rotateY(180deg)}
.flip.fly{transition:transform .28s ease-in,opacity .28s;transform:translateX(130%) rotate(14deg);opacity:0}
.flip.on.fly{transform:rotateY(180deg) translateX(-130%) rotate(-14deg)}
.flip.away{transition:transform .28s ease-in,opacity .28s;transform:translateX(-130%) rotate(-14deg);opacity:0}
.flip.on.away{transform:rotateY(180deg) translateX(130%) rotate(14deg)}
.flip.enter{animation:cardin .3s}
@keyframes cardin{from{transform:scale(.85);opacity:0}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;overflow:auto;border-top:8px solid var(--zc)}
.face.back{transform:rotateY(180deg);background:#241a66}
.lbl{font:400 13px var(--display);color:var(--zc);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.at{font:600 clamp(22px,6vw,30px)/1.25 var(--body)}
.at.long{font-size:15px;font-weight:500;line-height:1.45}
.tip{margin-top:16px;padding:10px 12px;background:#0a0724;box-shadow:inset 4px 0 0 var(--yellow);font-size:14px;color:var(--text)}
.tapnote{margin-top:auto;padding-top:14px;font:400 12px var(--display);color:var(--mute);text-transform:uppercase;animation:blink 1.4s steps(2) infinite}
.lbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;visibility:hidden}
.lbtns.show{visibility:visible}

/* match */
.mhud{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.clock{font:400 20px var(--display);color:var(--cyan)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{min-height:78px;padding:10px;font:600 15px/1.25 var(--body);color:var(--text);background:var(--ink2);border:0;box-shadow:inset 0 0 0 3px var(--line),0 4px 0 rgba(0,0,0,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.tile.q{border-top:6px solid var(--cyan)}
.tile.a{border-top:6px solid var(--pink)}
.tile.sel{background:var(--yellow);color:#150f3a;box-shadow:0 4px 0 rgba(0,0,0,.6);transform:translateY(-3px)}
.tile.good{background:var(--green);color:#06281c;box-shadow:none;animation:okpop .3s forwards;pointer-events:none}
.tile.good.gone{visibility:hidden;animation:none}
.tile.miss{background:var(--red);color:#2e0710;animation:shk .35s}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin:-4px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}

/* quiz scores */
.qs{padding:6px 16px}
.qrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:2px solid rgba(74,62,194,.5)}
.qrow:last-child{border:0}
.qrow h4{margin:0;font:400 16px/1.1 var(--display);color:var(--zc);text-transform:uppercase}
.qrow .qn{font-size:14px;color:var(--mute)}
.qrow .qn b{font:400 16px var(--display);color:var(--yellow)}
.qrow .bar{grid-column:1/-1;margin-top:2px}
.qrow .bar i{background:var(--zc)}
.mlist{margin-top:16px}
.mitem{padding:10px 12px;margin-top:8px;background:#0a0724;box-shadow:inset 4px 0 0 var(--red);font-size:14px}
.mitem b{display:block;color:var(--green);font-weight:600;margin-top:2px}

/* results */
.rtitle{font:400 clamp(34px,10vw,52px)/1 var(--display);text-transform:uppercase;color:var(--yellow);text-shadow:4px 4px 0 var(--pink);margin:10px 0 10px}
.rstars{display:flex;gap:10px;margin:8px 0 18px}
.rs{font-size:64px;line-height:1;color:#3a3090}
.rs.on{color:var(--yellow);animation:starin .5s both;animation-delay:var(--d)}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.4)}100%{transform:none}}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px solid rgba(74,62,194,.5)}
.rrow:last-child{border:0}
.rrow b{font:400 18px var(--display);color:var(--yellow)}
.rbtns{display:grid;gap:14px;margin-top:22px}
.newb{margin-top:16px;padding:12px;background:#2c2208;box-shadow:inset 0 0 0 3px var(--yellow)}
.newb b{font:400 14px var(--display);color:var(--yellow);text-transform:uppercase}

/* brain break */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(10,7,36,.92);display:flex;align-items:center;justify-content:center;padding:20px}
.overlay .panel{max-width:440px;width:100%;text-align:center}
.bigtime{font:400 84px/1 var(--display);color:var(--cyan);margin:10px 0}
.act{font:600 24px/1.25 var(--body);margin:10px 0 14px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  body::before{animation:none}
}
@media (max-width:380px){.zones{gap:12px}.zone{padding:12px 10px}}
</style>
</head>

{id:'c3',z:'chr',e:'🗣️',q:'Christianity is based on the teachings of ___.',a:'Jesus',mq:'Christianity is based on the teachings of…',ma:'Jesus',s:'Jesus',w:['Muhammad','Abraham','Buddha']},
{id:'c4',z:'chr',e:'1️⃣',q:'Is Christianity monotheistic or polytheistic?',a:'Monotheistic (one God)',mq:'Christianity: one God or many?',ma:'Monotheistic (one God)',s:'Monotheistic (one God)',w:['Polytheistic (many gods)'],tip:'Mono means one and poly means many. A monorail rides on one rail.',ck:'mono'},

{id:'j4',z:'jud',e:'🛌',q:'What is the Sabbath day in Judaism? (day of rest)',a:'Saturday',mq:'Judaism’s Sabbath (day of rest)',ma:'Saturday',s:'Saturday',w:['Sunday','Monday','Wednesday'],tip:'Sabbath means a day of rest. In Judaism it is Saturday.'},
{id:'j5',z:'jud',e:'🗺️',q:'Where did Judaism originate?',a:'The Middle East',mq:'Where Judaism began',ma:'The Middle East',s:'The Middle East',w:['India','Europe','South America'],ck:'origin'},
{id:'j6',z:'jud',e:'🕍',q:'Where do people who practice Judaism worship?',a:'Synagogue/temple',mq:'Where people practicing Judaism worship',ma:'Synagogue or temple',s:'Synagogue or temple',w:['Church','Mosque','Shrine'],ck:'temple'},
{id:'j7',z:'jud',e:'🧑‍🏫',q:'Who is the leader of each synagogue/temple?',a:'Rabbi',mq:'Leader of each synagogue or temple',ma:'Rabbi',s:'Rabbi',w:['Pope','Pastor','Apostle']},
{id:'j8',z:'jud',e:'🌟',q:'Who was the founder of Judaism?',a:'Abraham',mq:'Founder of Judaism',ma:'Abraham',s:'Abraham',w:['Jesus','Muhammad','Buddha']},
/* Islam */
{id:'i1',z:'isl',e:'✋',q:'What are the Five Pillars?',a:'Beliefs that all Muslims need to carry out',mq:'The Five Pillars of Islam',ma:'Beliefs all Muslims need to carry out',s:'Beliefs that all Muslims need to carry out',w:['Five holy books of Islam','Five holy cities of Islam','Five founders of Islam'],tip:'Think of 5 fingers: five things every Muslim needs to carry out.'},

var KEY='religionBlitz.v1';
function def(){return {xp:0,sound:true,chill:false,stars:{},studied:{},cards:{},badges:{},quiz:{}};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r),b=def();for(var k in b){if(d[k]!==undefined)b[k]=d[k];}return b;}}catch(e){}return def();}

var app=document.getElementById('app');

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function zoneById(id){return ZONES.filter(function(z){return z.id===id;})[0];}
function cardsOf(z){return z==='mix'?CARDS.slice():CARDS.filter(function(c){return c.z===z;});}
function cstat(c){return S.cards[c.id]||(S.cards[c.id]={c:0,w:0});}
function isMast(c){return ((S.cards[c.id]||{}).c||0)>=2;}
function stars(n){var s='';for(var i=1;i<=3;i++)s+=i<=n?'<b>★</b>':'★';return s;}
function lvlInfo(xp){var i=0;while(i+1<LEVELS.length&&xp>=LEVELS[i+1].at)i++;var cur=LEVELS[i],nx=LEVELS[i+1];return {i:i,name:cur.n,pct:nx?(xp-cur.at)/(nx.at-cur.at):1};}
function addXP(n){var b=lvlInfo(S.xp).i;S.xp+=n;var a=lvlInfo(S.xp).i;save();return a>b?a:null;}
function clearTimers(){if(G){clearInterval(G.timer);clearTimeout(G.adv);}}
function render(html){app.innerHTML=html;window.scrollTo(0,0);}
function mmss(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}

var Sfx={ctx:null,
 init:function(){if(this.ctx){if(this.ctx.state==='suspended'){try{this.ctx.resume();}catch(e){}}return;}try{var AC=window.AudioContext||window.webkitAudioContext;if(AC)this.ctx=new AC();}catch(e){}},
 tone:function(f,d,type,v,t){if(!S.sound||!this.ctx)return;try{var c=this.ctx,o=c.createOscillator(),g=c.createGain(),st=c.currentTime+(t||0);o.type=type||'square';o.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(v||.06,st);g.gain.exponentialRampToValueAtTime(.0001,st+d);o.connect(g);g.connect(c.destination);o.start(st);o.stop(st+d+.03);}catch(e){}},
 click:function(){this.tone(660,.05,'square',.04);},

 wrong:function(){this.tone(190,.18,'sawtooth',.06);this.tone(140,.26,'sawtooth',.06,.15);},

/* ---------- effects ---------- */
var cv=document.getElementById('fx'),cx=cv.getContext('2d'),parts=[],raf=0;
function sizeFx(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
sizeFx();window.addEventListener('resize',sizeFx);
function burst(x,y,colors,n,power){
  if(rm)n=Math.min(n,6);
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=(2+Math.random()*5)*(power||1);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,sz:4+Math.random()*7,c:colors[i%colors.length]});}
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.life>0&&p.y<cv.height+20;});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.life-=.016;cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.sz,p.sz);});
  cx.globalAlpha=1;
  if(parts.length)raf=requestAnimationFrame(tick);else{raf=0;cx.clearRect(0,0,cv.width,cv.height);}
}
var RAINBOW=['#27d3ff','#ffd23f','#34e0a1','#ff7a3d','#b57bff','#ff3d9a'];
function confetti(){var w=cv.width;for(var i=0;i<5;i++)(function(i){setTimeout(function(){burst(w*(.12+i*.19),cv.height*.28,RAINBOW,26,1.2);},i*130);})(i);}
function popAt(el,text,color){
  var r=el?el.getBoundingClientRect():{left:cv.width/2,top:cv.height/2,width:0,height:0};
  var d=document.createElement('div');d.className='pop';d.textContent=text;d.style.color=color||'#ffd23f';
  d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2-10)+'px';
  document.body.appendChild(d);setTimeout(function(){d.remove();},1000);
}
function centerOf(el){var r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
function shake(){if(rm)return;document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');setTimeout(function(){document.body.classList.remove('shake');},380);}
function toast(title,sub){var t=document.createElement('div');t.className='toast';t.innerHTML='<b>'+title+'</b>'+(sub?'<span>'+sub+'</span>':'');document.getElementById('toasts').appendChild(t);setTimeout(function(){t.remove();},2700);}
function award(id){
  if(S.badges[id])return false;S.badges[id]=true;save();
  var b=BADGES.filter(function(x){return x.id===id;})[0];
  if(G)(G.newBadges=G.newBadges||[]).push(b);
  toast('New badge: '+b.n,b.d);Sfx.level();return true;
}
function checkLevelBadge(up){if(up!==null&&up>=3)award('lvl4');}

var BOSS=['....oooooo....','..oooooooooo..','.oooooooooooo.','oooeeooooeeooo','oooepooooepooo','oooooooooooooo','oooommmmmmoooo','dddddddddddddd','dd.dd.dd.dd.dd','d...dd..dd...d'];
function bossSvg(){
  var px=8,r='';
  BOSS.forEach(function(row,y){for(var x=0;x<row.length;x++){var ch=row[x];if(ch==='.')continue;
    var f=ch==='e'?'#fff':(ch==='p'||ch==='m')?'#150f3a':'var(--zc)';
    r+='<rect x="'+x*px+'" y="'+y*px+'" width="'+px+'" height="'+px+'" fill="'+f+'"'+(ch==='d'?' fill-opacity=".7"':'')+'/>';}});
  return '<svg viewBox="0 0 '+14*px+' '+10*px+'" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}
function segs(total,done){var s='';for(var i=0;i<total;i++)s+='<i class="'+(i<done?'d':i===done?'c':'')+'"></i>';return s;}

function pct(q){return Math.round(q.c/q.n*100);}
function quizPanel(){
  var rows=ZONES.filter(function(z){return z.id!=='mix';}).map(function(z){
    var q=S.quiz[z.id]||{},l=q.last,b=q.best;

      '<div class="bar thin"><i style="width:'+(b?pct(b):0)+'%"></i></div></div>';

function startLearn(zid,custom){
  var list=custom?shuffle(custom.slice()):shuffle(cardsOf(zid));if(zid==='mix'&&!custom)list=list.slice(0,12);
  G={mode:'learn',zid:zid,queue:list,total:list.length,done:0,again:0,newBadges:[],custom:!!custom};LAST={m:'learn',z:zid};
  var z=zoneById(zid);
  render('<div class="lhud"><button class="btn sm ghost" data-act="zone" data-z="'+zid+'">‹ Quit</button><div class="segs" id="segs" style="--zc:'+z.color+'"></div><div class="left" id="left"></div></div>'+
    '<div class="flipwrap" style="--zc:'+z.color+'" id="fw"></div>'+
    '<div class="lbtns" id="lb"><button class="btn" style="--c:var(--orange)" data-act="again">Again</button><button class="btn" style="--c:var(--green)" data-act="got">Got it</button></div>');
  showLearn(true);
}
function showLearn(enter){
  var c=G.queue[0];
  document.getElementById('segs').innerHTML=segs(G.total,G.done);
  document.getElementById('left').textContent=G.queue.length+' left';
  var long=c.a.length>110;
  document.getElementById('fw').innerHTML=

function flipCard(){

function learnGot(ok){

/* ---------- boss battle ---------- */
function startBattle(zid){
  var z=zoneById(zid);
  var pool=shuffle(cardsOf(zid));
  pool.sort(function(a,b){return (isMast(a)?1:0)-(isMast(b)?1:0);});
  var n=zid==='mix'?10:Math.min(8,pool.length);
  var picked=shuffle(pool.slice(0,n));
  G={mode:'battle',zid:zid,queue:picked.map(function(c){return {c:c,tries:0};}),total:n,done:0,score:0,combo:0,best:0,firstOK:0,newMast:0,pw:{fifty:1,freeze:1},newBadges:[],cur:null};
  LAST={m:'battle',z:zid};
  render('<div class="hud" style="--zc:'+z.color+'"><button class="btn sm ghost" data-act="zone" data-z="'+zid+'">‹ Quit</button><div class="segs" id="segs"></div><div class="score"><span id="score">0</span> pts</div></div>'+
    '<div class="stage" style="--zc:'+z.color+'"><div class="boss" id="boss">'+bossSvg()+'</div><div class="bossinfo"><div class="bname">Forgetting Fog</div><div class="hp"><i id="hp" style="width:100%"></i></div><div class="combo" id="combo"></div></div></div>'+
    '<div id="qwrap" style="--zc:'+z.color+'"></div><div class="pws" id="pws"></div>');
  showQ();
}
function showQ(){
  var item=G.queue[0],c=item.c;
  var opts=shuffle([c.s].concat(c.w)).map(function(t){return {t:t,ok:t===c.s};});
  G.cur={item:item,opts:opts,elapsed:0,frozen:false,answered:false,used50:false};
  document.getElementById('segs').innerHTML=segs(G.total,G.done);
  var html='<div class="qcard panel"><div class="qe">'+c.e+'</div><div class="qt">'+(c.qmc||c.q)+'</div>'+
    (S.chill?'':'<div class="timer" id="timer"><i></i></div>')+'</div><div class="answers">'+
    opts.map(function(o,i){return '<button class="ans" data-act="ans" data-i="'+i+'"><kbd>'+(i+1)+'</kbd><span>'+o.t+'</span></button>';}).join('')+'</div><div id="fb" aria-live="polite"></div>';
  document.getElementById('qwrap').innerHTML=html;
  renderPW();
  clearInterval(G.timer);
  if(!S.chill){G.timer=setInterval(function(){
    if(!G.cur||G.cur.answered||G.cur.frozen)return;
    G.cur.elapsed+=100;var t=document.querySelector('#timer i');
    if(t)t.style.width=Math.max(0,100-G.cur.elapsed/120)+'%';
  },100);}
}
function renderPW(){
  var cur=G.cur,dis=!cur||cur.answered;
  var f=document.getElementById('pws');if(!f)return;
  f.innerHTML='<button class="btn sm pw" style="--c:var(--pink)" data-act="pw" data-p="fifty" '+((dis||G.pw.fifty<1||cur.used50||cur.opts.length<3)?'disabled':'')+'>50/50 <b>x'+G.pw.fifty+'</b></button>'+
   (S.chill?'':'<button class="btn sm pw" style="--c:var(--cyan)" data-act="pw" data-p="freeze" '+((dis||G.pw.freeze<1||cur.frozen)?'disabled':'')+'>Freeze time <b>x'+G.pw.freeze+'</b></button>')+
   '<span style="align-self:center;font-size:13px;color:var(--mute)">Earn power-ups with combos</span>';
}
function usePower(p){
  var cur=G.cur;if(!cur||cur.answered)return;
  if(p==='fifty'&&G.pw.fifty>0&&!cur.used50&&cur.opts.length>2){
    G.pw.fifty--;cur.used50=true;
    var wrongIdx=[];cur.opts.forEach(function(o,i){if(!o.ok)wrongIdx.push(i);});
    shuffle(wrongIdx).slice(0,cur.opts.length-2).forEach(function(i){document.querySelectorAll('.ans')[i].classList.add('gone');cur.opts[i].gone=true;});
    Sfx.power();
  }
  if(p==='freeze'&&G.pw.freeze>0&&!cur.frozen&&!S.chill){
    G.pw.freeze--;cur.frozen=true;var t=document.getElementById('timer');if(t)t.classList.add('frozen');Sfx.power();
  }
  renderPW();
}
function updateHUD(){
  document.getElementById('score').textContent=G.score;
  document.getElementById('hp').style.width=((G.total-G.done)/G.total*100)+'%';
  var c=document.getElementById('combo');
  c.className='combo'+(G.combo>=8?' c8':G.combo>=5?' c5':G.combo>=3?' c3':'');
  c.textContent=G.combo>=2?'Combo x'+G.combo:'';
  if(G.combo>=2){void c.offsetWidth;c.classList.add('pop');}
}
function hitBoss(){var b=document.getElementById('boss');if(!b)return;b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');}
function answer(i){
  var cur=G&&G.cur;if(!cur||cur.answered||!cur.opts[i]||cur.opts[i].gone)return;
  cur.answered=true;clearInterval(G.timer);
  var item=cur.item,c=item.c,o=cur.opts[i];
  var btns=document.querySelectorAll('.ans');
  btns.forEach(function(b){b.classList.add('lock');});
  var cs=cstat(c),first=item.tries===0;
  if(o.ok){
    btns[i].classList.add('ok');
    G.combo++;G.best=Math.max(G.best,G.combo);
    var speed=S.chill?25:Math.round(50*Math.max(0,1-cur.elapsed/12000));
    var pts=100+speed+Math.min(G.combo-1,10)*10;
    if(!first)pts=Math.round(pts/2);
    G.score+=pts;
    if(first){G.firstOK++;var was=isMast(c);cs.c++;if(!was&&isMast(c))G.newMast++;}
    G.queue.shift();G.done++;
    var p=centerOf(btns[i]);burst(p.x,p.y,[ZONES.filter(function(z){return z.id===G.zid;})[0].color,'#ffd23f','#fff'],20+G.combo*3,1+G.combo*.08);
    var words=['ZAP!','BOOM!','NICE!','YES!','POW!'];
    popAt(btns[i],'+'+pts+'  '+(G.combo>=3?'COMBO x'+G.combo:words[Math.floor(Math.random()*words.length)]),'#ffd23f');
    Sfx.correct(G.combo);hitBoss();
    if(G.combo===3){G.pw.fifty=Math.min(3,G.pw.fifty+1);toast('Power-up earned','+1 50/50');Sfx.power();}
    if(G.combo===5){G.pw.freeze=Math.min(3,G.pw.freeze+1);toast('Power-up earned','+1 Freeze time');Sfx.power();}
    updateHUD();renderPW();
    document.getElementById('segs').innerHTML=segs(G.total,G.done);
    var last=!G.queue.length;
    if(last){
      setTimeout(function(){var b=document.getElementById('boss');if(b){var q=centerOf(b);b.classList.add('dead');Sfx.boom();burst(q.x,q.y,RAINBOW,70,1.8);}},350);
      G.adv=setTimeout(finishBattle,1900);
    }else{
      if(c.tip){document.getElementById('fb').innerHTML='<div class="fb ok"><div class="fbh">Memory trick</div><div class="fbt" style="margin:0">'+c.tip+'</div></div>';}
      G.adv=setTimeout(nextQ,c.tip?2200:1000);
    }
  }else{
    btns[i].classList.add('bad');
    cur.opts.forEach(function(op,k){if(op.ok)btns[k].classList.add('ok');});
    G.combo=0;cs.w++;if(first)cs.c=Math.max(0,cs.c-1);
    item.tries++;
    G.queue.shift();
    var again=item.tries<2;
    if(again)G.queue.push(item);else G.done++;
    Sfx.wrong();shake();updateHUD();renderPW();
    document.getElementById('segs').innerHTML=segs(G.total,G.done);
    document.getElementById('fb').innerHTML='<div class="fb bad"><div class="fbh">Almost! The answer is</div><div class="fba">'+c.a+'</div>'+
      (c.tip?'<div class="fbt">'+c.tip+'</div>':'')+
      '<div class="fbt">'+(again?'This card comes back so you can zap it.':'Moving on. You will see it again next round.')+'</div>'+
      '<button class="btn" data-act="next">Next ▶</button></div>';
    save();
    setTimeout(function(){var f=document.querySelector('#fb .btn');if(f&&f.scrollIntoView)f.scrollIntoView({block:'nearest',behavior:rm?'auto':'smooth'});},60);
    if(!G.queue.length){document.querySelector('#fb .btn').textContent='Finish ▶';}
  }
  save();
}
function nextQ(){
  if(!G||G.mode!=='battle')return;
  clearTimeout(G.adv);
  if(!G.queue.length){finishBattle();return;}
  showQ();window.scrollTo(0,0);
}
function finishBattle(){
  clearInterval(G.timer);
  var ratio=G.firstOK/G.total,st=ratio>=.85?3:ratio>=.55?2:1;
  var old=(S.stars[G.zid]||{}).battle||0;(S.stars[G.zid]=S.stars[G.zid]||{}).battle=Math.max(old,st);
  var xp=Math.round(G.score/2)+25*st,up=addXP(xp);checkLevelBadge(up);
  award('first_win');
  if(G.best>=5)award('combo5');
  if(G.firstOK===G.total)award('flawless');
  if(G.zid!=='mix'&&st===3)award('zone_master');
  if(ZONES.filter(function(z){return z.id!=='mix';}).every(function(z){return ((S.stars[z.id]||{}).battle||0)===3;}))award('world_champ');
  save();Sfx.win();confetti();
  results({title:'Fog Defeated',stars:st,showStars:true,zid:G.zid,rows:[['Score',G.score],['Right on the first try',G.firstOK+' of '+G.total],['Best combo','x'+G.best],['Cards newly mastered',G.newMast],['XP earned','+'+xp]],levelUp:up,next:'match'});
}

/* ---------- quiz ---------- */
var MISSED=[];
function startQuiz(zid){
  var z=zoneById(zid),list=shuffle(cardsOf(zid));
  G={mode:'quiz',zid:zid,queue:list,total:list.length,idx:0,right:0,missed:[],bySec:{},newBadges:[],cur:null};
  LAST={m:'quiz',z:zid};
  render('<div class="hud" style="--zc:'+z.color+'"><button class="btn sm ghost" data-act="zone" data-z="'+zid+'">‹ Quit</button><div class="segs" id="segs"></div><div class="score" id="qn"></div></div><div id="qwrap"></div>');

}
function showQuizQ(){
  var c=G.queue[G.idx];
  var opts=shuffle([c.s].concat(c.w)).map(function(t){return {t:t,ok:t===c.s};});
  G.cur={c:c,opts:opts,answered:false};

    opts.map(function(o,i){return '<button class="ans" data-act="ans" data-i="'+i+'"><kbd>'+(i+1)+'</kbd><span>'+o.t+'</span></button>';}).join('')+'</div><div id="fb" aria-live="polite"></div>';
  window.scrollTo(0,0);
}
function quizAnswer(i){
  var cur=G&&G.cur;if(!cur||cur.answered||!cur.opts[i])return;
  cur.answered=true;
  var c=cur.c,btns=document.querySelectorAll('.ans');
  btns.forEach(function(b){b.classList.add('lock');});
  var sec=G.bySec[c.z]=G.bySec[c.z]||{c:0,n:0};sec.n++;
  G.idx++;
  document.getElementById('segs').innerHTML=segs(G.total,G.idx);
  if(cur.opts[i].ok){
    btns[i].classList.add('ok');G.right++;sec.c++;Sfx.correct(1);
    var p=centerOf(btns[i]);burst(p.x,p.y,['#34e0a1','#ffd23f','#fff'],14,1);popAt(btns[i],'Correct','#34e0a1');
    G.adv=setTimeout(quizNext,900);
  }else{
    btns[i].classList.add('bad');
    cur.opts.forEach(function(o,k){if(o.ok)btns[k].classList.add('ok');});

      '<button class="btn" data-act="next">'+(G.idx>=G.total?'See my score':'Next ▶')+'</button></div>';

  }
}
function quizNext(){
  if(!G||G.mode!=='quiz')return;
  clearTimeout(G.adv);

}
function saveQuizScore(id,c,n){
  var rec=S.quiz[id]||(S.quiz[id]={});
  rec.last={c:c,n:n};
  if(!rec.best||c/n>=rec.best.c/rec.best.n)rec.best={c:c,n:n};
}
function finishQuiz(){
  var p=Math.round(G.right/G.total*100);
  saveQuizScore(G.zid,G.right,G.total);
  if(G.zid==='mix'){for(var id in G.bySec)saveQuizScore(id,G.bySec[id].c,G.bySec[id].n);}
  var st=p>=90?3:p>=70?2:p>=50?1:0;
  var xp=G.right*5+(p===100?50:0),up=addXP(xp);checkLevelBadge(up);
  if(p===100)award('quiz_ace');
  save();MISSED=G.missed.slice();

  var rows=[['Score',G.right+' of '+G.total],['Percent',p+'%']];
  if(G.zid==='mix')ZONES.filter(function(z){return z.id!=='mix';}).forEach(function(z){var b=G.bySec[z.id]||{c:0,n:0};rows.push([z.name,b.c+' of '+b.n]);});
  rows.push(['XP earned','+'+xp]);
  var title=p>=90?'Quiz Crushed':p>=70?'Nice Work':p>=50?'Getting There':'Keep Training';
  var extra='';
  if(G.missed.length){extra='<div class="mlist"><div class="sect" style="margin:20px 0 4px">Cards to review ('+G.missed.length+')</div>'+G.missed.map(function(c){return '<div class="mitem">'+(c.qmc||c.q)+'<b>'+c.a+'</b></div>';}).join('')+'</div>';}
  else extra='<div class="newb"><b>No misses</b><br>Every answer was right.</div>';
  results({title:title,stars:st,showStars:true,zid:G.zid,rows:rows,levelUp:up,next:'battle',extra:extra,studyMissed:G.missed.length>0});
}

/* ---------- match rush ---------- */
function startMatch(zid){
  var pool=shuffle(cardsOf(zid)),picked=[],ck={},ma={};
  for(var i=0;i<pool.length&&picked.length<6;i++){var c=pool[i];
    if(c.ck&&ck[c.ck])continue;if(ma[c.ma])continue;picked.push(c);if(c.ck)ck[c.ck]=1;ma[c.ma]=1;}
  var tiles=[];picked.forEach(function(c){tiles.push({id:c.id+'q',pair:c.id,k:'q',t:c.mq});tiles.push({id:c.id+'a',pair:c.id,k:'a',t:c.ma});});
  shuffle(tiles);
  G={mode:'match',zid:zid,tiles:tiles,pairs:picked.length,found:0,miss:0,combo:0,best:0,score:0,sel:null,lock:false,secs:0,newBadges:[]};
  LAST={m:'match',z:zid};
  render('<div class="mhud"><button class="btn sm ghost" data-act="zone" data-z="'+zid+'">‹ Quit</button><div class="score" style="flex:1"><span id="score">0</span> pts</div><div class="clock" id="clock">'+(S.chill?'':'0:00')+'</div></div>'+
    '<div class="legend"><span><i style="background:var(--cyan)"></i>Question</span><span><i style="background:var(--pink)"></i>Answer</span></div>'+
    '<div class="tiles" id="tiles">'+tiles.map(function(t){return '<button class="tile '+t.k+'" data-act="tile" data-tid="'+t.id+'">'+t.t+'</button>';}).join('')+'</div>');
  if(!S.chill)G.timer=setInterval(function(){G.secs++;var c=document.getElementById('clock');if(c)c.textContent=mmss(G.secs);},1000);
}
function tapTile(el){
  if(!G||G.mode!=='match'||G.lock||el.classList.contains('good'))return;
  var t=G.tiles.filter(function(x){return x.id===el.dataset.tid;})[0];
  Sfx.click();
  if(!G.sel){G.sel={t:t,el:el};el.classList.add('sel');return;}
  if(G.sel.el===el){el.classList.remove('sel');G.sel=null;return;}
  if(G.sel.t.k===t.k){G.sel.el.classList.remove('sel');G.sel={t:t,el:el};el.classList.add('sel');return;}
  var a=G.sel;G.sel=null;
  if(a.t.pair===t.pair){
    a.el.classList.remove('sel');a.el.classList.add('good');el.classList.add('good');
    G.found++;G.combo++;G.best=Math.max(G.best,G.combo);
    var pts=100+Math.min(G.combo-1,5)*10;G.score+=pts;document.getElementById('score').textContent=G.score;
    var p=centerOf(el);burst(p.x,p.y,RAINBOW,18,1);popAt(el,'+'+pts,'#ffd23f');Sfx.match();
    setTimeout(function(){a.el.classList.add('gone');el.classList.add('gone');},420);
    if(G.found===G.pairs){G.lock=true;clearInterval(G.timer);setTimeout(finishMatch,700);}
  }else{
    G.lock=true;G.miss++;G.combo=0;a.el.classList.add('miss');el.classList.add('miss');Sfx.wrong();
    setTimeout(function(){a.el.classList.remove('sel','miss');el.classList.remove('miss');G.lock=false;},450);
  }
}
function finishMatch(){
  var t=G.secs,m=G.miss,st;
  if(S.chill)st=m<=1?3:m<=4?2:1;else st=(m<=1&&t<=60)?3:(m<=4&&t<=120)?2:1;
  var bonus=S.chill?100:Math.max(0,Math.round(300-t*4));
  var score=G.score+bonus;
  var old=(S.stars[G.zid]||{}).match||0;(S.stars[G.zid]=S.stars[G.zid]||{}).match=Math.max(old,st);
  var xp=Math.round(score/2)+25*st,up=addXP(xp);checkLevelBadge(up);
  if(!S.chill&&t<=40&&m<=1)award('speedy');
  save();Sfx.win();confetti();
  var rows=[['Pairs matched',G.pairs],['Misses',m]];
  if(!S.chill)rows.push(['Time',mmss(t)]);
  rows.push(['Score',score],['XP earned','+'+xp]);
  results({title:'All Matched',stars:st,showStars:true,zid:G.zid,rows:rows,levelUp:up,next:'battle'});
}

/* ---------- brain break ---------- */
function breakTime(){
  if(document.getElementById('brk'))return;
  var secs=30,o=document.createElement('div');o.className='overlay';o.id='brk';
  o.innerHTML='<div class="panel"><div class="sect" style="margin-top:0">Brain break</div><div class="act">'+ACTIVITIES[Math.floor(Math.random()*ACTIVITIES.length)]+'</div><div class="bigtime" id="bt">30</div><button class="btn block" data-act="brkdone">I’m back</button></div>';
  document.body.appendChild(o);
  breakTimer=setInterval(function(){secs--;var b=document.getElementById('bt');if(b)b.textContent=secs;if(secs<=0){clearInterval(breakTimer);Sfx.level();if(b)b.textContent='Go!';}},1000);
}
function closeBreak(){clearInterval(breakTimer);var o=document.getElementById('brk');if(o)o.remove();}

/* ---------- actions ---------- */
var ACT={
  home:function(){home();},
  zone:function(t){modes(t.dataset.z);},
  start:function(t){var m=t.dataset.m,z=t.dataset.z;if(m==='learn')startLearn(z);else if(m==='battle')startBattle(z);else if(m==='quiz')startQuiz(z);else startMatch(z);},
  studymissed:function(){if(MISSED.length)startLearn(LAST.z,MISSED);},
  snd:function(){S.sound=!S.sound;save();document.querySelectorAll('[data-act="snd"]').forEach(function(b){b.textContent=S.sound?'Sound on':'Muted';});if(S.sound)Sfx.click();},
  chill:function(t){S.chill=!S.chill;save();t.textContent=S.chill?'Chill mode: on (no timer)':'Chill mode: off';},
  ans:function(t){if(G&&G.mode==='quiz')quizAnswer(+t.dataset.i);else answer(+t.dataset.i);},
  pw:function(t){usePower(t.dataset.p);},
  next:function(){if(G&&G.mode==='quiz')quizNext();else nextQ();},
  flip:function(){flipCard();},
  got:function(){learnGot(true);},
  again:function(){learnGot(false);},
  tile:function(t){tapTile(t);},
  brk:function(){breakTime();},
  brkdone:function(){closeBreak();},
  replay:function(){if(!LAST)return home();ACT.start({dataset:{m:LAST.m,z:LAST.z}});},
  reset:function(t){if(t.dataset.arm){S=def();save();home();}else{t.dataset.arm='1';t.textContent='Tap again to erase all progress';}}
};
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;if(!t)return;
  Sfx.init();
  var fn=ACT[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;
  if(!G)return;
  if(G.mode==='battle'){
    if(e.key>='1'&&e.key<='4'){answer(+e.key-1);}
    else if((e.key==='Enter'||e.key===' ')&&G.cur&&G.cur.answered){var n=document.querySelector('#fb .btn');if(n){e.preventDefault();nextQ();}}
  }else if(G.mode==='quiz'){
    if(e.key>='1'&&e.key<='4'){quizAnswer(+e.key-1);}
    else if((e.key==='Enter'||e.key===' ')&&G.cur&&G.cur.answered&&document.querySelector('#fb .btn')){e.preventDefault();quizNext();}
  }else if(G.mode==='learn'){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}
    else if(e.key==='ArrowRight')learnGot(true);
    else if(e.key==='ArrowLeft')learnGot(false);
  }
});

home();
})();
</script>
</body>
</html>
